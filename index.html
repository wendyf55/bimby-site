<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Butterflies of BC</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />

  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="species-info.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="layout">
    <aside id="panel" aria-label="Butterflies near you">
      <header class="app-head">
        <div class="app-title"><a href="./" id="homeLink" title="Start over">Butterflies of British Columbia</a></div>
        <div class="app-sub">Where they&rsquo;ve been seen, when they fly, and the plants they use</div>
        <div class="app-game"><a href="game/">Try the butterfly guessing game</a></div>
      </header>
      <div id="content"></div>
      <div id="announce" class="sr-only" aria-live="polite"></div>
    </aside>
    <div id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize panel" tabindex="0"
      title="Drag to resize (double-click to reset)"></div>
    <main id="mapwrap">
      <section id="trends" aria-label="Trends by year" aria-hidden="true"></section>
      <section id="flowers" aria-label="Plants butterflies use" aria-hidden="true"></section>
      <div id="map" role="application" aria-label="Map of British Columbia"></div>
    </main>
  </div>

  <script src="app.js"></script>

</body>

</html>
