<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIMBY — Butterflies In My Backyard</title>

  <link rel="stylesheet" href="vendor/leaflet/leaflet.css" />
  <script src="vendor/leaflet/leaflet.js"></script>
  <script src="species-info.js"></script>

  <link rel="stylesheet" href="styles.css" />
</head>

<body>
  <div id="layout">
    <aside id="panel" aria-label="Butterflies near you">
      <header class="app-head">
        <div class="app-title">Butterflies of British Columbia</div>
        <div class="app-sub">Provide your location, click anywhere on the map, or draw a polygon</div>
      </header>
      <div id="content"></div>
      <div id="announce" class="sr-only" aria-live="polite"></div>
    </aside>
    <div id="resizer" role="separator" aria-orientation="vertical" aria-label="Resize panel" tabindex="0"
      title="Drag to resize (double-click to reset)"></div>
    <main id="mapwrap">
      <section id="trends" aria-label="Trends by year" aria-hidden="true"></section>
      <div id="map" role="application" aria-label="Map of British Columbia"></div>
    </main>
  </div>

  <script src="app.js"></script>

</body>

</html>
