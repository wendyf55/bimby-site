<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIMBY — Option B</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="species-info.js"></script>

  <style>
    :root {
      /* Tonal green family (same as the other pages) */
      --green-900: #22301b;
      --green-800: #33472a;
      --green-700: #3e5433;
      --line:      rgba(255, 255, 255, 0.13);
      --ink:       #f4f6f0;
      --ink-dim:   rgba(244, 246, 240, 0.60);
      --accent:      #e79a3c;
      --accent-ink:  #2b1d06;
      --accent-dark: #b8691c;
      --surface:       rgba(255, 255, 255, 0.10);
      --surface-hover: rgba(255, 255, 255, 0.18);

      /* Light popup card */
      --card:      #fbfaf6;
      --card-ink:  #1f261b;
      --card-dim:  #6a7263;
      --card-line: #e4e1d6;
      --card-soft: #f1efe7;

      --sidebar-w: 420px;
      --popup-w: 600px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 15px;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    #layout { display: flex; height: 100vh; }

    /* ---------- Sidebar ---------- */
    #sidebar {
      width: var(--sidebar-w);
      flex: 0 0 var(--sidebar-w);
      background: var(--green-800);
      display: flex;
      flex-direction: column;
      height: 100%;
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.18);
      z-index: 1001;
    }
    .app-head { padding: 18px 20px 14px; border-bottom: 1px solid var(--line); position: relative; }
    #hideSide {
      position: absolute; right: 12px; top: 14px; border: 0; background: transparent;
      color: var(--ink-dim); font-size: 24px; line-height: 1; cursor: pointer; padding: 2px 6px;
    }
    #hideSide:hover { color: var(--ink); }
    #layout.side-hidden #sidebar { display: none; }
    #showSide {
      position: absolute; left: 58px; top: 10px; z-index: 1001; display: none;
      background: var(--green-800); color: var(--ink); border: 0; border-radius: 8px;
      padding: 8px 14px; font: inherit; font-size: 13px; cursor: pointer;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    #showSide:hover { background: var(--green-700); }
    #layout.side-hidden #showSide { display: block; }
    .app-title { font-size: 20px; font-weight: 700; letter-spacing: 0.14em; }
    .app-sub { font-size: 12px; color: var(--ink-dim); margin-top: 2px; }
    #side { flex: 1 1 0; overflow-y: auto; padding: 4px 20px 20px; }

    .label {
      font-size: 11px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase;
      color: var(--ink-dim); margin: 20px 0 8px;
    }
    .seg { display: flex; background: var(--surface); border-radius: 8px; padding: 3px; gap: 3px; }
    .seg button {
      flex: 1; border: 0; background: transparent; color: var(--ink); padding: 7px 4px;
      border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer;
    }
    .seg button:hover { background: var(--surface-hover); }
    .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 600; }

    #side select {
      width: 100%; background: var(--surface); color: var(--ink); border: 1px solid var(--line);
      border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 14px;
    }
    #side select option { color: #000; }

    .legend { display: flex; flex-direction: column; gap: 4px; font-size: 13px; }
    .legend i {
      display: inline-block; width: 16px; height: 12px; border-radius: 3px; margin-right: 8px;
      vertical-align: -1px; border: 1px solid rgba(0, 0, 0, 0.25);
    }
    .totals { font-size: 13px; line-height: 1.6; color: var(--ink-dim); }
    .totals b { color: var(--ink); }
    .side-hint { font-size: 13px; color: var(--ink-dim); line-height: 1.5; margin-top: 18px; }

    /* ---------- Map ---------- */
    #mapwrap { flex: 1; position: relative; overflow: hidden; }
    #map { position: absolute; top: 0; bottom: 0; left: 0; right: 0; }
    #mapwrap.popopen #map { right: calc(var(--popup-w) + 24px); }
    /* "Show on map" for one species */
    .map-sp { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin: 4px 0 18px; clear: both; }
    .map-sp-btn {
      background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 999px;
      padding: 7px 14px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer;
    }
    .map-sp-btn:hover { filter: brightness(1.06); }
    .map-sp-btn.on { background: #eeebe2; color: var(--card-ink); font-weight: 400; }
    .map-sp-note { font-size: 12px; color: var(--card-dim); }
    .map-legend {
      background: rgba(255, 255, 255, 0.94); color: #22301b; padding: 8px 10px; border-radius: 6px;
      font: 12px "Helvetica Neue", Helvetica, Arial, sans-serif; box-shadow: 0 1px 6px rgba(0,0,0,0.25); line-height: 1.5;
    }
    .map-legend b { display: block; margin-bottom: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
    .map-legend i { display: inline-block; width: 14px; height: 10px; margin-right: 6px; border-radius: 2px;
                    vertical-align: -1px; border: 1px solid rgba(0,0,0,0.2); }
    .sp-banner {
      background: #22301b; color: #f4f6f0; padding: 8px 12px; border-radius: 8px;
      font: 13px "Helvetica Neue", Helvetica, Arial, sans-serif; box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      display: flex; align-items: center; gap: 10px;
    }
    .sp-banner button { background: rgba(255,255,255,0.15); color: inherit; border: 0; border-radius: 6px;
                        padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer; }
    .sp-banner button:hover { background: rgba(255,255,255,0.28); }
    .leaflet-tooltip.eco-tip { font: 13px "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .eco-tip .t-sub { color: #666; font-size: 12px; }

    /* ---------- Popup card ---------- */
    #popup {
      position: absolute; top: 14px; right: 14px; bottom: 14px; width: var(--popup-w);
      max-width: calc(100% - 28px);
      background: var(--card); color: var(--card-ink); border-radius: 14px;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.28);
      display: none; flex-direction: column; overflow: hidden; z-index: 1000;
    }
    #popup.open { display: flex; }
    .pop-head { padding: 18px 22px 0; position: relative; }
    .eyebrow { font-size: 11px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--card-dim); font-weight: 600; padding-right: 30px; }
    .pop-head h2 { margin: 2px 0 12px; font-size: 24px; letter-spacing: -0.01em; padding-right: 30px; }
    .close {
      position: absolute; right: 14px; top: 12px; border: 0; background: transparent;
      font-size: 26px; color: var(--card-dim); cursor: pointer; line-height: 1;
    }
    .close:hover { color: var(--card-ink); }
    .stats { display: grid; grid-template-columns: 1fr 1fr 1.4fr; gap: 8px; margin-bottom: 14px; }
    .stat { background: var(--card-soft); border-radius: 10px; padding: 8px 10px; }
    .stat .n { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }
    .stat .n.small { font-size: 15px; padding-top: 4px; }
    .stat .k { font-size: 11px; color: var(--card-dim); }

    .tabs { display: flex; gap: 2px; border-bottom: 1px solid var(--card-line); padding: 0 16px; }
    .tabs button {
      border: 0; background: transparent; padding: 10px 12px; font: inherit; font-size: 14px;
      color: var(--card-dim); cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px;
    }
    .tabs button:hover { color: var(--card-ink); }
    .tabs button.on { color: var(--card-ink); font-weight: 600; border-bottom-color: var(--accent); }
    .pop-body { padding: 16px 22px 20px; overflow: auto; flex: 1; }
    .pop-foot {
      border-top: 1px solid var(--card-line); padding: 10px 22px; font-size: 12px; color: var(--card-dim);
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
    }
    .pop-foot button {
      border: 0; background: none; color: #7a3d0a; font: inherit; font-size: 12px; cursor: pointer; padding: 0 0 0 12px;
    }
    .pop-foot button:hover { text-decoration: underline; }

    .empty { padding: 18px 20px; background: var(--card-soft); border-radius: 10px; color: var(--card-dim); font-size: 13px; line-height: 1.5; }
    .empty a { color: #7a3d0a; }

    /* Charts */
    .chart { margin-bottom: 22px; }
    .chart-title { font-weight: 600; font-size: 14px; margin: 0 0 2px; }
    .chart-sub { font-size: 12px; color: var(--card-dim); margin: 0 0 8px; }
    .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
    .chart text { font-size: 11px; fill: var(--card-dim); font-family: inherit; }
    .chart .bar { fill: var(--accent); }
    .chart .hit:hover + .bar { fill: var(--accent-dark); }
    .chart text.val { fill: var(--card-ink); font-weight: 600; }
    #tip {
      position: fixed; pointer-events: none; background: #1f261b; color: #fff; font-size: 12px;
      padding: 6px 9px; border-radius: 6px; display: none; z-index: 5000; white-space: nowrap;
    }

    .rank-row { display: grid; grid-template-columns: 170px 1fr 48px; gap: 10px; align-items: center; font-size: 13px; padding: 3px 0; }
    .rank-row .track { background: #eeebe2; border-radius: 3px; height: 12px; }
    .rank-row .fill { background: var(--accent); height: 12px; border-radius: 3px; opacity: 0.55; }
    .rank-row.me { font-weight: 700; }
    .rank-row.me .fill, .rank-row.solid .fill { opacity: 1; }
    .rank-row .v { text-align: right; font-variant-numeric: tabular-nums; }
    .rank-row.link { cursor: pointer; }
    .rank-row.link:hover span:first-child { text-decoration: underline; }

    .fs-stats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; margin: 6px 0 16px; font-size: 12px; }
    .fs-stats div { background: var(--card-soft); border-radius: 8px; padding: 6px 8px; color: var(--card-dim); }
    .fs-stats b { display: block; font-size: 14px; color: var(--card-ink); }

    /* Species list */
    .sp-tools { display: flex; gap: 8px; margin-bottom: 10px; }
    .sp-tools input, .sp-tools select, .list-select {
      background: #fff; color: var(--card-ink); border: 1px solid var(--card-line); border-radius: 8px;
      padding: 8px 10px; font: inherit; font-size: 14px;
    }
    .sp-tools input { flex: 1; min-width: 0; }
    table.sp { width: 100%; border-collapse: collapse; font-size: 13px; }
    table.sp th {
      text-align: left; font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--card-dim);
      font-weight: 600; padding: 6px; border-bottom: 1px solid var(--card-line); position: sticky; top: -16px; background: var(--card); white-space: nowrap;
    }
    table.sp td { padding: 7px 6px; border-bottom: 1px solid #eeebe2; vertical-align: top; }
    table.sp tr.row { cursor: pointer; }
    table.sp tr.row:hover td { background: #f5f2e8; }
    table.sp tr.row.hl td { background: #fdf0dc; }
    .sp-cell { display: flex; align-items: center; gap: 10px; }
    table.sp .sci { font-style: italic; color: var(--card-dim); font-size: 12px; }
    table.sp .num { text-align: right; font-variant-numeric: tabular-nums; }
    .minibar { height: 5px; background: var(--accent); border-radius: 3px; margin: 4px 0 0 auto; }
    .pill { font-size: 10px; font-weight: 700; letter-spacing: 0.05em; padding: 2px 7px; border-radius: 10px; background: #e2ecd9; color: #33472a; white-space: nowrap; }
    .pill.none { background: #eeebe2; color: #9a9a8f; }

    /* Species detail */
    .back { border: 0; background: transparent; color: #7a3d0a; font: inherit; font-size: 13px; cursor: pointer; padding: 0; margin-bottom: 8px; }
    .back:hover { text-decoration: underline; }
    .det-h { font-size: 20px; font-weight: 700; margin: 0; }
    .det-sci { font-style: italic; color: var(--card-dim); margin: 0 0 12px; }
    .pl-toggle { display: flex; gap: 6px; margin: 4px 0 10px; }
    .pl-toggle button { border: 1px solid var(--card-line); background: #fff; border-radius: 16px; padding: 5px 14px; font: inherit; font-size: 13px; cursor: pointer; }
    .pl-toggle button.on { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
    .list-select { width: 100%; margin-bottom: 8px; }
    ul.plants { list-style: none; padding: 0; margin: 0; }
    ul.plants li { padding: 7px 0; border-bottom: 1px solid #eeebe2; display: flex; justify-content: space-between; gap: 10px; font-size: 13px; }
    ul.plants li i { color: var(--card-dim); }
    ul.plants .bloom { color: var(--card-dim); white-space: nowrap; }
    .cite { font-size: 11px; color: var(--card-dim); margin-top: 10px; line-height: 1.5; }
    .cite a { color: #7a3d0a; }
  </style>
</head>

<body>

  <div id="layout">
    <aside id="sidebar">
      <div class="app-head">
        <button id="hideSide" title="Hide panel" aria-label="Hide panel">×</button>
        <div class="app-title">BIMBY</div>
        <div class="app-sub">Butterflies in My Backyard · ecoregion atlas</div>
      </div>
      <div id="side">
        <div class="label">Colour ecoregions by</div>
        <div class="seg" id="colourBy">
          <button data-v="species" class="on">Species</button>
          <button data-v="obs">Sightings</button>
        </div>

        <div class="label">Map one species</div>
        <select id="spSelect"><option value="">All species</option></select>

        <div class="label">Year</div>
        <select id="yearSel"><option value="">All years</option></select>

        <div class="label" id="legendLabel">Legend</div>
        <div class="legend" id="legend"></div>

        <div class="label">All of Canada</div>
        <div class="totals" id="totals">Loading…</div>

        <p class="side-hint">Click an ecoregion on the map to see its butterflies, sightings by year and flight season.</p>
      </div>
    </aside>

    <main id="mapwrap">
      <div id="map"></div>
      <button id="showSide" title="Show panel">☰ Map options</button>

      <section id="popup" aria-label="Ecoregion details">
        <div class="pop-head">
          <button class="close" id="closePop" title="Close">×</button>
          <div class="eyebrow" id="pEyebrow"></div>
          <h2 id="pName"></h2>
          <div class="stats" id="pStats"></div>
        </div>
        <nav class="tabs" id="tabs">
          <button data-t="species">Species list</button>
          <button data-t="overview">Overview</button>
          <button data-t="season">Flight season</button>
          <button data-t="compare">Compare regions</button>
        </nav>
        <div class="pop-body" id="popBody"></div>
        <div class="pop-foot">
          <span id="footInfo">Data: Shepard &amp; Guppy (2001)</span>
          <span><button id="dlCsv">Download CSV</button><button id="copyLink">Copy link</button></span>
        </div>
      </section>
    </main>
  </div>
  <div id="tip"></div>

  <script>
    // ---------- Constants ----------
    const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
    const NONE_FILL = '#ffffff';
    // Sequential scales (one hue, light -> dark). Species bins match Option A.
    const BINS = {
      species: [[1, '#fbe3bd', '1–5'], [6, '#f4bf74', '6–15'], [16, '#e79a3c', '16–30'], [31, '#b8691c', '31–60'], [61, '#7a3d0a', '61+']],
      obs:     [[1, '#fbe3bd', '1–25'], [26, '#f4bf74', '26–100'], [101, '#e79a3c', '101–500'], [501, '#b8691c', '501–2,000'], [2001, '#7a3d0a', '2,000+']],
      oneSp:   [[1, '#fbe3bd', '1–2'], [3, '#f4bf74', '3–10'], [11, '#e79a3c', '11–40'], [41, '#b8691c', '41–150'], [151, '#7a3d0a', '151+']],
    };
    const INAT_PROJECT = 'https://www.inaturalist.org/projects/2026-butterflies-in-my-backyard-bimby-project';

    // ---------- State ----------
    let observations = [], plantIndex = {}, regions = [];
    let stats = new Map();            // regionId -> region stats (for the current year filter)
    let allYears = [];                // years present in the data
    const state = {
      colourBy: 'species', species: '', year: '',
      region: null, tab: 'species',
      spSort: 'count', spFilter: '', detail: null, plantCat: 'host', listId: null,
    };

    const fmt = n => n.toLocaleString('en-CA');
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const fmtDate = (d, withYear) => {
      const [y, m, dd] = d.split('-');
      return MONTHS[+m - 1] + ' ' + (+dd) + (withYear ? ', ' + y : '');
    };
    const multiYear = () => !state.year && allYears.length > 1;

    // ---------- Map ----------
    const BC_BOUNDS = [[48.2, -139.1], [60.0, -114.0]];   // British Columbia
    const map = L.map('map', { zoomSnap: 0.25 }).fitBounds(BC_BOUNDS);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        + ' | Ecoregions: <a href="https://sis.agr.gc.ca/cansis/nsdb/ecostrat/" target="_blank" rel="noopener">AAFC</a>'
    }).addTo(map);
    let regionLayer = null;
    const layerById = new Map();

    // ---------- Load data ----------
    Promise.all([
      fetch('data/observations.json').then(r => r.json()),
      fetch('data/plant-lists.json').then(r => r.json()),
      fetch('data/ecoregions.geojson').then(r => r.json()),
      fetch('data/observation-ecoregions.json').then(r => r.json()),
    ]).then(([obs, lists, geo, obsRegion]) => {
      observations = obs; regions = geo.features;
      for (const o of observations) {
        o._region = obsRegion[o.id] ?? null;
        o._year = (o.observedOn || '').slice(0, 4);
      }
      for (const l of lists) (plantIndex[l.butterfly.scientificName] ??= []).push(l);
      allYears = [...new Set(observations.map(o => o._year).filter(Boolean))].sort();
      buildControls();
      computeStats();
      drawMap();
      renderSidebar();
      restoreFromHash();
      // photos + descriptions (re-render the popup once they arrive)
      SpeciesInfo.load().then(() => { if (state.region != null) renderPopup(); });
    }).catch(err => {
      document.getElementById('totals').textContent = 'Could not load data files.';
      console.error(err);
    });

    // ---------- Stats ----------
    function emptyStats() {
      return { obs: 0, species: new Map(), dek: new Array(36).fill(0), days: [], first: null, last: null };
    }
    function dayOfYear(d) {
      const t = Date.UTC(+d.slice(0, 4), +d.slice(5, 7) - 1, +d.slice(8, 10));
      return Math.round((t - Date.UTC(+d.slice(0, 4), 0, 1)) / 86400000);
    }
    // Per-region stats for the current year filter
    function computeStats() {
      stats = new Map();
      for (const o of observations) {
        if (o._region == null || (state.year && o._year !== state.year)) continue;
        let r = stats.get(o._region);
        if (!r) stats.set(o._region, r = emptyStats());
        const d = o.observedOn, m = +d.slice(5, 7), dd = +d.slice(8, 10);
        r.obs++;
        r.dek[(m - 1) * 3 + Math.min(2, Math.floor((dd - 1) / 10))]++;
        r.days.push(dayOfYear(d));
        if (!r.first || d < r.first) r.first = d;
        if (!r.last || d > r.last) r.last = d;
        let s = r.species.get(o.scientificName);
        if (!s) r.species.set(o.scientificName, s = {
          sci: o.scientificName, common: o.commonName, count: 0, first: d, last: d, months: new Array(12).fill(0)
        });
        s.count++; s.months[m - 1]++;
        if (d < s.first) s.first = d;
        if (d > s.last) s.last = d;
      }
    }
    // Sightings & species per year for one region (always all years — that's the point of the chart)
    function yearlyFor(regionId) {
      const byYear = new Map(allYears.map(y => [y, { obs: 0, sp: new Set() }]));
      for (const o of observations) {
        if (o._region !== regionId) continue;
        const y = byYear.get(o._year);
        if (y) { y.obs++; y.sp.add(o.scientificName); }
      }
      return allYears.map(y => ({ year: y, obs: byYear.get(y).obs, species: byYear.get(y).sp.size }));
    }
    const regionProps = id => regions.find(f => f.properties.id === id)?.properties;
    const rStats = id => stats.get(id) || emptyStats();

    function valueFor(id) {
      const r = stats.get(id);
      if (!r) return 0;
      if (state.species) return r.species.get(state.species)?.count || 0;
      return state.colourBy === 'obs' ? r.obs : r.species.size;
    }
    const measureLabel = () => state.species ? 'sightings' : (state.colourBy === 'obs' ? 'sightings' : 'species');
    const currentBins = () => BINS[state.species ? 'oneSp' : state.colourBy];
    function colourFor(v) {
      let c = null;
      for (const [min, col] of currentBins()) if (v >= min) c = col;
      return c;
    }

    // ---------- Map layers ----------
    function styleFor(f) {
      const id = f.properties.id, c = colourFor(valueFor(id)), sel = id === state.region;
      return {
        color: sel ? '#22301b' : '#5b6b52', weight: sel ? 3 : 0.6, opacity: sel ? 1 : 0.55,
        fillColor: c || NONE_FILL,
        fillOpacity: !c ? 0.05 : (state.region == null || sel || state.species ? 0.75 : 0.3),   // no fading while one species is mapped
      };
    }

    function drawMap() {
      regionLayer = L.geoJSON({ type: 'FeatureCollection', features: regions }, {
        style: styleFor,
        onEachFeature: (f, layer) => {
          layerById.set(f.properties.id, layer);
          layer.bindTooltip(() => {
            const v = valueFor(f.properties.id);
            return `<b>${esc(f.properties.name)}</b><br><span class="t-sub">${esc(f.properties.zoneName)} ecozone · ` +
              `${v ? fmt(v) + ' ' + measureLabel() + (state.species ? ' of ' + esc(commonName(state.species)) : '') : 'no sightings' + (state.species ? ' of ' + esc(commonName(state.species)) : '')}</span>`;
          }, { sticky: true, className: 'eco-tip' });
          layer.on('mouseover', () => { if (f.properties.id !== state.region) layer.setStyle({ weight: 2, opacity: 1 }); });
          layer.on('mouseout', () => regionLayer.resetStyle(layer));
          layer.on('click', () => openRegion(f.properties.id, false));
        }
      }).addTo(map);

    }

    function restyle() {
      regionLayer.setStyle(styleFor);
      layerById.get(state.region)?.bringToFront();
    }

    // ---------- Sidebar ----------
    function buildControls() {
      // Species dropdown (A–Z by common name, with total sightings)
      const totals = new Map();
      for (const o of observations) {
        const t = totals.get(o.scientificName) || { sci: o.scientificName, common: o.commonName, n: 0 };
        t.n++; totals.set(o.scientificName, t);
      }
      const spSel = document.getElementById('spSelect');
      [...totals.values()].sort((a, b) => (a.common || a.sci).localeCompare(b.common || b.sci)).forEach(s => {
        const o = document.createElement('option');
        o.value = s.sci; o.textContent = `${s.common || s.sci} (${fmt(s.n)})`;
        spSel.appendChild(o);
      });
      spSel.addEventListener('change', () => {
        state.species = spSel.value; restyle(); renderSidebar();
        if (state.region != null) renderPopup();
      });

      // Year dropdown fills in automatically as new years appear in the data
      const ySel = document.getElementById('yearSel');
      allYears.slice().reverse().forEach(y => {
        const o = document.createElement('option'); o.value = y; o.textContent = y; ySel.appendChild(o);
      });
      ySel.addEventListener('change', () => {
        state.year = ySel.value; state.detail = null;
        computeStats(); restyle(); renderSidebar();
        if (state.region != null) renderPopup();
      });

      document.querySelectorAll('#colourBy button').forEach(b => b.addEventListener('click', () => {
        document.querySelectorAll('#colourBy button').forEach(x => x.classList.toggle('on', x === b));
        state.colourBy = b.dataset.v;
        state.species = ''; spSel.value = '';
        restyle(); renderSidebar();
        if (state.region != null && state.tab === 'compare') renderPopup();
      }));
    }

    // ---------- One species on the map ----------
    const banner = L.control({ position: 'topright' });
    banner.onAdd = () => { const d = L.DomUtil.create('div', 'sp-banner'); L.DomEvent.disableClickPropagation(d); return d; };
    const regionsWith = sci => regions.filter(f => (stats.get(f.properties.id)?.species.get(sci)?.count || 0) > 0);
    // Density legend on the map itself while one species is shown
    const mapLegend = L.control({ position: 'bottomright' });
    mapLegend.onAdd = () => L.DomUtil.create('div', 'map-legend');
    function updateMapLegend() {
      if (!state.species) { mapLegend.remove(); return; }
      if (!mapLegend.getContainer() || !mapLegend.getContainer().parentNode) mapLegend.addTo(map);
      mapLegend.getContainer().innerHTML = `<b>Sightings of ${esc(commonName(state.species))}${state.year ? ' · ' + state.year : ''}</b>` +
        currentBins().map(([, c, label]) => `<div><i style="background:${c}"></i>${label} per ecoregion</div>`).join('') +
        '<div><i style="background:transparent"></i>Not seen</div>';
    }
    function updateBanner() {
      updateMapLegend();
      if (!state.species) { banner.remove(); return; }
      if (!banner.getContainer() || !banner.getContainer().parentNode) banner.addTo(map);
      const n = regionsWith(state.species).length, d = banner.getContainer();
      d.innerHTML = `<span>Showing <b>${esc(commonName(state.species))}</b> · seen in ${n} ecoregion${n === 1 ? '' : 's'}${state.year ? ' in ' + state.year : ''}</span><button type="button">Clear</button>`;
      d.querySelector('button').addEventListener('click', () => showSpeciesOnMap(''));
    }
    // Used by the button in a species' detail view (and the banner's Clear)
    function showSpeciesOnMap(sci) {
      state.species = sci; document.getElementById('spSelect').value = sci;
      restyle(); renderSidebar();
      if (sci) {
        const hit = regionsWith(sci).map(f => layerById.get(f.properties.id));
        if (hit.length) map.fitBounds(L.featureGroup(hit).getBounds(), { padding: [30, 30], maxZoom: 6 });
      }
      if (state.region != null) renderPopup();
    }

    function renderSidebar() {
      updateBanner();
      document.getElementById('legendLabel').textContent = 'Legend — ' +
        (state.species ? 'sightings of ' + commonName(state.species) : (state.colourBy === 'obs' ? 'sightings' : 'species seen'));
      document.getElementById('legend').innerHTML =
        currentBins().map(([, c, label]) => `<div><i style="background:${c}"></i>${label}</div>`).join('') +
        `<div><i style="background:rgba(255,255,255,0.12);border-color:rgba(255,255,255,0.35)"></i>None recorded</div>`;

      const inYear = observations.filter(o => !state.year || o._year === state.year);
      const dates = inYear.map(o => o.observedOn).filter(Boolean).sort();
      document.getElementById('totals').innerHTML = inYear.length
        ? `<b>${fmt(inYear.length)}</b> sightings · <b>${new Set(inYear.map(o => o.scientificName)).size}</b> species<br>` +
          `${fmtDate(dates[0], true)} – ${fmtDate(dates[dates.length - 1], true)}`
        : 'No sightings for this year.';
    }
    function commonName(sci) {
      return observations.find(o => o.scientificName === sci)?.commonName || sci;
    }

    // ---------- Popup ----------
    function openRegion(id, zoom) {
      state.region = id; state.detail = null; state.spFilter = '';
      document.getElementById('popup').classList.add('open');
      document.getElementById('mapwrap').classList.add('popopen');
      map.invalidateSize();
      restyle();
      if (zoom) map.fitBounds(layerById.get(id).getBounds(), { padding: [30, 30], maxZoom: 7 });
      renderPopup();
    }
    function closeRegion() {
      state.region = null; state.detail = null;
      document.getElementById('popup').classList.remove('open');
      document.getElementById('mapwrap').classList.remove('popopen');
      map.invalidateSize();
      restyle(); updateHash();
    }
    document.getElementById('closePop').addEventListener('click', closeRegion);

    // Hide / show the left panel (map grows to fill the space)
    function setSidebar(show) {
      document.getElementById('layout').classList.toggle('side-hidden', !show);
      map.invalidateSize();
    }
    document.getElementById('hideSide').addEventListener('click', () => setSidebar(false));
    document.getElementById('showSide').addEventListener('click', () => setSidebar(true));
    document.querySelectorAll('#tabs button').forEach(b => b.addEventListener('click', () => {
      state.tab = b.dataset.t; state.detail = null; renderPopup();
    }));

    function renderPopup() {
      const p = regionProps(state.region), r = rStats(state.region);
      document.querySelectorAll('#tabs button').forEach(b => b.classList.toggle('on', b.dataset.t === state.tab));
      document.getElementById('pEyebrow').textContent = `Ecoregion · ${p.zoneName} ecozone`;
      document.getElementById('pName').textContent = p.name;
      const range = r.obs ? (r.first === r.last ? fmtDate(r.first) : `${fmtDate(r.first)} – ${fmtDate(r.last)}`) : '—';
      document.getElementById('pStats').innerHTML = [
        [fmt(r.obs), 'sightings'], [fmt(r.species.size), 'species'],
        [range, (state.year || (allYears.length === 1 ? allYears[0] : 'all years')) + ' date range', true],
      ].map(([n, k, small]) => `<div class="stat"><div class="n ${small ? 'small' : ''}">${n}</div><div class="k">${k}</div></div>`).join('');
      document.getElementById('footInfo').textContent =
        `Data: Shepard & Guppy (2001)${state.year ? ', ' + state.year : ''}`;
      document.getElementById('dlCsv').style.display = r.obs ? '' : 'none';

      const body = document.getElementById('popBody');
      updateHash();
      if (!r.obs) {
        body.innerHTML = `<div class="empty">No butterfly records in this ecoregion${state.year ? ' in ' + state.year : ''} yet.<br>
          Seen one here? Add it to the <a href="${INAT_PROJECT}" target="_blank" rel="noopener">BIMBY project on iNaturalist</a>.</div>`;
        return;
      }
      if (state.detail) return renderDetail(body);
      ({ species: renderSpecies, overview: renderOverview, season: renderSeason, compare: renderCompare })[state.tab](body);
    }

    // ---------- Bar chart helper (vertical bars, inline SVG) ----------
    function barChart(data, opts = {}) {
      // data: [{ label, value, tip }]
      const W = 540, H = opts.h || 150, padL = 40, padB = 22, padT = 18;
      const iw = W - padL - 6, ih = H - padB - padT;
      const top = niceMax(Math.max(1, ...data.map(d => d.value)));
      const step = iw / data.length, bw = Math.min(opts.maxBar || 60, step * 0.72);
      let g = '';
      [0, 0.5, 1].forEach(f => {
        const y = padT + ih - ih * f;
        g += `<line x1="${padL}" x2="${W - 6}" y1="${y}" y2="${y}" stroke="#e4e1d6"/>` +
             `<text x="${padL - 6}" y="${y + 4}" text-anchor="end">${fmt(Math.round(top * f))}</text>`;
      });
      data.forEach((d, i) => {
        const h = ih * d.value / top, x = padL + step * i + (step - bw) / 2, y = padT + ih - h;
        const r = Math.min(4, bw / 2, h);
        g += `<rect class="hit" x="${padL + step * i}" y="${padT}" width="${step}" height="${ih}" fill="transparent" data-tip="${esc(d.tip || d.label + ': ' + fmt(d.value))}"/>`;
        g += h > 0
          ? `<path class="bar" pointer-events="none" d="M${x},${padT + ih} V${y + r} Q${x},${y} ${x + r},${y} H${x + bw - r} Q${x + bw},${y} ${x + bw},${y + r} V${padT + ih} Z"/>`
          : '<g></g>';
        if (d.label) g += `<text x="${padL + step * i + step / 2}" y="${H - 6}" text-anchor="middle">${esc(d.label)}</text>`;
        if (opts.direct && d.value) g += `<text class="val" x="${x + bw / 2}" y="${y - 5}" text-anchor="middle">${fmt(d.value)}</text>`;
      });
      return `<svg viewBox="0 0 ${W} ${H}" role="img">${g}</svg>`;
    }
    function niceMax(v) {
      const p = Math.pow(10, Math.floor(Math.log10(v)));
      for (const m of [1, 2, 2.5, 5, 10]) if (m * p >= v) return m * p;
      return 10 * p;
    }
    document.addEventListener('mousemove', e => {
      const t = e.target.closest && e.target.closest('[data-tip]'), tip = document.getElementById('tip');
      if (t) {
        tip.style.display = 'block'; tip.textContent = t.dataset.tip;
        tip.style.left = (e.clientX + 12) + 'px'; tip.style.top = (e.clientY + 12) + 'px';
      } else tip.style.display = 'none';
    });

    // ---------- Tab: species list ----------
    function speciesRows() {
      return [...rStats(state.region).species.values()];
    }
    function sortedSpecies() {
      let rows = speciesRows();
      const q = state.spFilter.trim().toLowerCase();
      if (q) rows = rows.filter(s => (s.sci + ' ' + (s.common || '')).toLowerCase().includes(q));
      const name = s => (s.common || s.sci);
      const sorts = {
        count: (a, b) => b.count - a.count || name(a).localeCompare(name(b)),
        rare:  (a, b) => a.count - b.count || name(a).localeCompare(name(b)),
        az:    (a, b) => name(a).localeCompare(name(b)),
        early: (a, b) => dayOfYear(a.first) - dayOfYear(b.first) || name(a).localeCompare(name(b)),
      };
      return rows.sort(sorts[state.spSort]);
    }
    function renderSpecies(body) {
      const all = speciesRows(), rows = sortedSpecies();
      const max = Math.max(...all.map(s => s.count));
      const my = multiYear();
      body.innerHTML = `
        <div class="sp-tools">
          <input type="search" id="spQ" placeholder="Search ${all.length} species…" value="${esc(state.spFilter)}">
          <select id="spSort">
            <option value="count">Most seen first</option><option value="rare">Rarest first</option>
            <option value="az">A–Z</option><option value="early">Earliest in the year</option>
          </select>
        </div>
        <table class="sp">
          <thead><tr><th>Butterfly</th><th class="num">Sightings</th><th>First – last seen</th><th>Plants</th></tr></thead>
          <tbody>${rows.map(s => `
            <tr class="row ${s.sci === state.species ? 'hl' : ''}" data-sci="${esc(s.sci)}">
              <td><div class="sp-cell">${SpeciesInfo.thumb(s.sci, { small: true })}<div><div>${esc(s.common || s.sci)}</div><div class="sci">${esc(s.sci)}</div></div></div></td>
              <td class="num">${fmt(s.count)}<div class="minibar" style="width:${Math.max(4, 100 * s.count / max)}%"></div></td>
              <td>${fmtDate(s.first, my)}${s.first !== s.last ? ' – ' + fmtDate(s.last, my) : ''}</td>
              <td>${plantIndex[s.sci] ? '<span class="pill">Host · Nectar</span>' : '<span class="pill none">not yet</span>'}</td>
            </tr>`).join('') || `<tr><td colspan="4" style="color:var(--card-dim)">No species match “${esc(state.spFilter)}”.</td></tr>`}
          </tbody>
        </table>`;
      const sel = body.querySelector('#spSort');
      sel.value = state.spSort;
      sel.addEventListener('change', () => { state.spSort = sel.value; renderPopup(); });
      const inp = body.querySelector('#spQ');
      inp.addEventListener('input', () => {
        state.spFilter = inp.value;
        const pos = inp.selectionStart;
        renderPopup();
        const n = document.getElementById('spQ'); n.focus(); n.setSelectionRange(pos, pos);
      });
      body.querySelectorAll('tr.row').forEach(tr => tr.addEventListener('click', () => {
        state.detail = tr.dataset.sci; state.listId = null; renderPopup();
        document.getElementById('popBody').scrollTop = 0;
      }));
    }

    // ---------- Species detail: when it flies + host & nectar plants ----------
    function renderDetail(body) {
      const p = regionProps(state.region);
      const s = rStats(state.region).species.get(state.detail);
      if (!s) { state.detail = null; return renderPopup(); }
      const lists = plantIndex[s.sci] || [];
      const list = lists.find(l => l.id === state.listId) || lists[0];
      const plants = list ? list.plants.filter(pl => (state.plantCat === 'host') === !!pl.isHost) : [];
      body.innerHTML = `
        <button class="back" id="back">‹ Back to species list</button>
        <p class="det-h">${esc(s.common || s.sci)}</p>
        <p class="det-sci">${esc(s.sci)} · ${fmt(s.count)} sighting${s.count === 1 ? '' : 's'} in ${esc(p.name)}</p>
        ${SpeciesInfo.card(s.sci, { layout: 'side' })}
        <div class="map-sp">
          <button class="map-sp-btn ${state.species === s.sci ? 'on' : ''}" id="mapSpBtn" type="button">
            ${state.species === s.sci ? 'Stop showing on map' : 'Show where it’s been seen'}</button>
          <span class="map-sp-note">Seen in ${regionsWith(s.sci).length} of ${regions.length} ecoregions${state.year ? ' in ' + state.year : ''}</span>
        </div>
        <div class="chart">
          <p class="chart-title">When it flies here</p>
          <p class="chart-sub">Sightings by month in ${esc(p.name)}${state.year ? ', ' + state.year : ''}</p>
          ${barChart(MONTHS.map((m, i) => ({ label: m, value: s.months[i], tip: `${m}: ${fmt(s.months[i])} sighting${s.months[i] === 1 ? '' : 's'}` })), { h: 110, maxBar: 26 })}
        </div>
        <div class="pl-toggle">
          <button data-c="host" class="${state.plantCat === 'host' ? 'on' : ''}">Host plants</button>
          <button data-c="nectar" class="${state.plantCat === 'nectar' ? 'on' : ''}">Nectar plants</button>
        </div>
        ${!list ? `<div class="empty">No host or nectar plant list for this species yet.</div>` : `
          ${lists.length > 1
            ? `<select class="list-select" id="listSel">${lists.map(l => `<option value="${esc(l.id)}" ${l === list ? 'selected' : ''}>${esc(l.region)} — ${esc(shortSource(l.source.org))} (${l.source.year})</option>`).join('')}</select>`
            : `<p class="chart-sub">Region: ${esc(list.region)}</p>`}
          ${plants.length
            ? `<ul class="plants">${plants.map(pl => `<li><span>${esc(pl.commonName)} <i>${esc(pl.scientificName)}</i></span>${pl.bloom ? `<span class="bloom">${esc(pl.bloom)}</span>` : ''}</li>`).join('')}</ul>`
            : `<div class="empty">None listed as ${state.plantCat} plants in this list.</div>`}
          <p class="cite">Source: ${esc((list.source.authors || []).join(', '))}${list.source.authors ? ' ' : ''}(${list.source.year}).
            <a href="${esc(list.source.url)}" target="_blank" rel="noopener">${esc(list.source.title)}</a>. ${esc(list.source.org)}.</p>`}`;
      body.querySelector('#back').addEventListener('click', () => { state.detail = null; renderPopup(); });
      body.querySelector('#mapSpBtn').addEventListener('click', () => showSpeciesOnMap(state.species === s.sci ? '' : s.sci));
      body.querySelectorAll('.pl-toggle button').forEach(b => b.addEventListener('click', () => { state.plantCat = b.dataset.c; renderPopup(); }));
      body.querySelector('#listSel')?.addEventListener('change', e => { state.listId = e.target.value; renderPopup(); });
    }
    function shortSource(org) { return /xerces/i.test(org) ? 'Xerces Society' : org; }

    // ---------- Tab: overview ----------
    function renderOverview(body) {
      const p = regionProps(state.region), r = rStats(state.region);
      const yearly = yearlyFor(state.region);
      const top = [...r.species.values()].sort((a, b) => b.count - a.count).slice(0, 5);
      body.innerHTML = `
        <div class="chart">
          <p class="chart-title">Sightings by year</p>
          <p class="chart-sub">Butterfly observations logged in ${esc(p.name)}, all years</p>
          ${barChart(yearly.map(y => ({ label: y.year, value: y.obs, tip: `${y.year}: ${fmt(y.obs)} sightings` })), { direct: true })}
        </div>
        <div class="chart">
          <p class="chart-title">Species by year</p>
          <p class="chart-sub">Different butterfly species seen, all years</p>
          ${barChart(yearly.map(y => ({ label: y.year, value: y.species, tip: `${y.year}: ${fmt(y.species)} species` })), { direct: true })}
        </div>
        <div class="chart">
          <p class="chart-title">Most-seen species here</p>
          <p class="chart-sub">Top ${top.length} by sightings${state.year ? ' in ' + state.year : ''}</p>
          ${top.map(s => `<div class="rank-row solid link" data-sci="${esc(s.sci)}"><span>${esc(s.common || s.sci)}</span>
            <div class="track"><div class="fill" style="width:${100 * s.count / top[0].count}%"></div></div>
            <span class="v">${fmt(s.count)}</span></div>`).join('')}
        </div>`;
      body.querySelectorAll('.rank-row.link').forEach(el => el.addEventListener('click', () => {
        state.tab = 'species'; state.detail = el.dataset.sci; renderPopup();
      }));
    }

    // ---------- Tab: flight season ----------
    function renderSeason(body) {
      const p = regionProps(state.region), r = rStats(state.region);
      const days = r.days.slice().sort((a, b) => a - b);
      const q = f => days[Math.min(days.length - 1, Math.floor(f * (days.length - 1)))];
      const doyLabel = doy => { const d = new Date(Date.UTC(2001, 0, 1) + doy * 86400000); return MONTHS[d.getUTCMonth()] + ' ' + d.getUTCDate(); };
      const labels = [];
      MONTHS.forEach(m => ['early', 'mid', 'late'].forEach(x => labels.push(`${x} ${m}`)));
      const first = r.dek.findIndex(v => v > 0), last = 35 - [...r.dek].reverse().findIndex(v => v > 0);
      const lo = Math.max(0, first - 3), hi = Math.min(36, last + 4);
      const data = r.dek.slice(lo, hi).map((v, k) => {
        const i = lo + k;
        return { label: i % 3 === 0 ? MONTHS[i / 3] : '', value: v, tip: `${labels[i]}: ${fmt(v)} sighting${v === 1 ? '' : 's'}` };
      });
      body.innerHTML = `
        <p class="chart-title">Flight season in ${esc(p.name)}</p>
        <p class="chart-sub">Sightings per 10-day period, all species${state.year ? ', ' + state.year : (allYears.length > 1 ? ', all years combined' : '')}</p>
        <div class="fs-stats">
          <div>Earliest<b>${doyLabel(days[0])}</b></div>
          <div>10% seen by<b>${doyLabel(q(0.1))}</b></div>
          <div>Median<b>${doyLabel(q(0.5))}</b></div>
          <div>90% seen by<b>${doyLabel(q(0.9))}</b></div>
          <div>Latest<b>${doyLabel(days[days.length - 1])}</b></div>
        </div>
        <div class="chart">${barChart(data, { h: 180, maxBar: 14 })}</div>
        <p class="chart-sub">Tip: open a species from the Species list to see its own flight season here.</p>`;
    }

    // ---------- Tab: compare regions ----------
    function renderCompare(body) {
      const p = regionProps(state.region);
      const key = state.colourBy;
      const val = id => { const r = stats.get(id); return !r ? 0 : (key === 'obs' ? r.obs : r.species.size); };
      const rows = regions.map(f => f.properties).filter(x => x.zoneId === p.zoneId && val(x.id) > 0)
        .sort((a, b) => val(b.id) - val(a.id));
      const max = Math.max(1, ...rows.map(x => val(x.id)));
      const noData = regions.filter(f => f.properties.zoneId === p.zoneId).length - rows.length;
      body.innerHTML = `
        <p class="chart-title">${key === 'obs' ? 'Sightings' : 'Species'} in each ecoregion of the ${esc(p.zoneName)} ecozone</p>
        <p class="chart-sub">Follows the “Colour ecoregions by” setting${state.year ? ' · ' + state.year : ''} · click a name to open it</p>
        ${rows.map(x => `<div class="rank-row link ${x.id === state.region ? 'me' : ''}" data-id="${x.id}"><span>${esc(x.name)}</span>
          <div class="track"><div class="fill" style="width:${100 * val(x.id) / max}%"></div></div>
          <span class="v">${fmt(val(x.id))}</span></div>`).join('')}
        ${noData ? `<p class="chart-sub" style="margin-top:10px">${noData} other ecoregion${noData === 1 ? '' : 's'} in this ecozone ha${noData === 1 ? 's' : 've'} no sightings yet.</p>` : ''}`;
      body.querySelectorAll('.rank-row.link').forEach(el => el.addEventListener('click', () => {
        const id = Number(el.dataset.id);
        if (id !== state.region) { const t = state.tab; openRegion(id, true); state.tab = t; renderPopup(); }
      }));
    }

    // ---------- Footer: CSV + shareable link ----------
    document.getElementById('dlCsv').addEventListener('click', () => {
      const p = regionProps(state.region);
      const rows = [['common_name', 'scientific_name', 'sightings', 'first_seen', 'last_seen', 'has_plant_list']]
        .concat(sortedSpecies().map(s => [s.common || '', s.sci, s.count, s.first, s.last, plantIndex[s.sci] ? 'yes' : 'no']));
      const csv = rows.map(r => r.map(v => /[",\n]/.test(String(v)) ? `"${String(v).replace(/"/g, '""')}"` : v).join(',')).join('\n');
      const a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([csv], { type: 'text/csv' }));
      a.download = `bimby-${p.name.toLowerCase().replace(/[^a-z0-9]+/g, '-')}${state.year ? '-' + state.year : ''}.csv`;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    });
    document.getElementById('copyLink').addEventListener('click', e => {
      const btn = e.currentTarget;
      const done = ok => { btn.textContent = ok ? 'Link copied' : 'Copy failed'; setTimeout(() => btn.textContent = 'Copy link', 1500); };
      (navigator.clipboard ? navigator.clipboard.writeText(location.href) : Promise.reject()).then(() => done(true), () => done(false));
    });

    // URL hash keeps the open region/tab so links can be shared: #region=123&tab=season&year=2026
    function updateHash() {
      const h = new URLSearchParams();
      if (state.region != null) { h.set('region', state.region); if (state.tab !== 'species') h.set('tab', state.tab); }
      if (state.year) h.set('year', state.year);
      const s = h.toString();
      history.replaceState(null, '', location.pathname + location.search + (s ? '#' + s : ''));
    }
    function restoreFromHash() {
      const h = new URLSearchParams(location.hash.slice(1));
      const y = h.get('year');
      if (y && allYears.includes(y)) {
        state.year = y; document.getElementById('yearSel').value = y;
        computeStats(); restyle(); renderSidebar();
      }
      const t = h.get('tab');
      if (['species', 'overview', 'season', 'compare'].includes(t)) state.tab = t;
      const id = Number(h.get('region'));
      if (h.has('region') && regionProps(id)) openRegion(id, true);
    }
    // A pasted/edited link on an already-open page
    window.addEventListener('hashchange', () => { if (regions.length) restoreFromHash(); });
  </script>

  <script src="dev-switcher.js"></script>
</body>

</html>
