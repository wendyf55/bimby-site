# Weekly refresh of the iNaturalist data (research-grade butterflies in BC).
#
# Runs every Monday, and on demand from the Actions tab ("Run workflow"; tick
# "full" to force a complete re-pull). See scripts/fetch_inat.py for how it
# talks to iNaturalist. Commits only when the data actually changed.
name: Update iNaturalist data

on:
  schedule:
    - cron: "17 11 * * 1"      # Mondays 11:17 UTC (4:17 am in Vancouver in summer)
  workflow_dispatch:
    inputs:
      full:
        description: "Full re-pull instead of only recent changes"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-inat
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shapely (ecoregion tagging)
        run: pip install "shapely>=2.1"

      - name: Fetch from iNaturalist
        run: python scripts/fetch_inat.py ${{ inputs.full && '--full' || '' }}

      - name: Build observations-inat.json
        run: python scripts/build_inat.py

      - name: Descriptions and photos for any new species
        # Only fetches species not already in data/species-info.json.
        # A hiccup here shouldn't block the data update; the next run retries.
        continue-on-error: true
        run: python scripts/build_species_info.py

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inat data/observations-inat.json data/species-info.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update iNaturalist data ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
