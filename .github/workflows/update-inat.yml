# Weekly refresh of the iNaturalist data (research-grade butterflies in BC).
#
# Runs every Monday and Thursday, and on demand from the Actions tab ("Run workflow";
# tick "full" to force a complete re-pull). See scripts/fetch_inat.py for how it
# talks to iNaturalist. Commits only when the data actually changed.
#
# The raw cache (data/inat/cache.jsonl, ~30 MB) is not in git: it is kept in the
# GitHub Actions cache. GitHub deletes cache entries not used for 7 days, hence two
# runs a week. If it is ever gone, the next run simply does a full pull.
#
# A full pull (~150k records) can take over an hour. The fetch stops itself after
# 100 minutes, keeps what it has in the Actions cache, and starts a follow-up run
# that carries on from there. The site data only changes once the pull is complete.
name: Update iNaturalist data

on:
  schedule:
    - cron: "17 11 * * 1,4"    # Mondays and Thursdays 11:17 UTC (4:17 am in Vancouver in summer)
  workflow_dispatch:
    inputs:
      full:
        description: "Full re-pull instead of only recent changes"
        type: boolean
        default: false

permissions:
  contents: write
  actions: write               # to start the follow-up run and use the cache

concurrency:
  group: update-inat
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install shapely (ecoregion tagging)
        run: pip install -r .github/requirements-ci.txt   # exact versions; Dependabot proposes updates

      - name: Restore the iNaturalist cache
        uses: actions/cache/restore@v4
        with:
          path: data/inat/cache.jsonl
          key: inat-cache-${{ github.run_id }}
          restore-keys: inat-cache-

      - name: Restore an unfinished full pull, if any
        uses: actions/cache/restore@v4
        with:
          path: data/inat/partial.jsonl
          key: inat-partial-${{ github.run_id }}
          restore-keys: inat-partial-

      - name: Fetch from iNaturalist
        id: fetch
        run: python scripts/fetch_inat.py --time-limit 100 ${{ inputs.full && '--full' || '' }}

      # --- Pull not finished yet: keep progress, start the next run, stop here ---
      - name: Keep progress for the next run
        if: steps.fetch.outputs.partial == 'true'
        uses: actions/cache/save@v4
        with:
          path: data/inat/partial.jsonl
          key: inat-partial-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Start a follow-up run to continue
        if: steps.fetch.outputs.partial == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run update-inat.yml --ref "${{ github.ref_name }}" -f full=${{ inputs.full && 'true' || 'false' }}

      # --- Pull finished: keep the new cache, build and commit ---
      - name: Save the iNaturalist cache
        if: steps.fetch.outputs.partial != 'true'
        uses: actions/cache/save@v4
        with:
          path: data/inat/cache.jsonl
          key: inat-cache-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Build observations-inat.json
        if: steps.fetch.outputs.partial != 'true'
        run: python scripts/build_inat.py

      - name: Descriptions and photos for any new species
        # Only fetches species not already in data/species-info.json.
        # An issue here shouldn't block the data update; the next run retries.
        if: steps.fetch.outputs.partial != 'true'
        continue-on-error: true
        run: python scripts/build_species_info.py

      - name: Commit if changed
        if: steps.fetch.outputs.partial != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/inat/state.json data/observations-inat.json data/species-info.json
          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi
          git commit -m "Update iNaturalist data ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
