<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BIMBY — Option A</title>

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

  <style>
    :root {
      /* Tonal green family */
      --green-900: #22301b;   /* settings footer (deepest) */
      --green-800: #33472a;   /* sidebar base */
      --green-700: #3e5433;   /* surfaces / hover */
      --line:      rgba(255, 255, 255, 0.13);

      /* Text */
      --ink:     #f4f6f0;
      --ink-dim: rgba(244, 246, 240, 0.60);

      /* Single warm accent (monarch amber) for all active states */
      --accent:      #e79a3c;
      --accent-ink:  #2b1d06;

      /* Neutral translucent button surface */
      --surface:       rgba(255, 255, 255, 0.10);
      --surface-hover: rgba(255, 255, 255, 0.18);

      --sidebar-w: 440px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-size: 16px;
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
    }

    #layout { display: flex; height: 100vh; }

    #sidebar {
      width: var(--sidebar-w);
      flex: 0 0 var(--sidebar-w);
      background: var(--green-800);
      color: var(--ink);
      display: flex;
      flex-direction: column;
      height: 100%;
      box-shadow: 2px 0 12px rgba(0, 0, 0, 0.18);
      z-index: 1000;
    }

    #map { flex: 1; height: 100%; }

    /* App header */
    .app-head {
      padding: 16px 18px 14px;
      border-bottom: 1px solid var(--line);
    }
    .app-title {
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 0.14em;
    }
    .app-sub {
      font-size: 12px;
      color: var(--ink-dim);
      margin-top: 2px;
      letter-spacing: 0.02em;
    }

    /* Main scroll area */
    #main { flex: 1 1 0; overflow-y: auto; padding: 0 18px 18px; }
    #main::-webkit-scrollbar { width: 8px; }
    #main::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.18); border-radius: 4px; }

    .hint { color: var(--ink-dim); font-size: 0.9em; padding-top: 16px; line-height: 1.5; }

    /* Sticky column header */
    .col-head {
      position: sticky;
      top: 0;
      background: var(--green-800);
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      padding: 16px 0 10px;
      margin-bottom: 2px;
      border-bottom: 1px solid var(--line);
      z-index: 2;
    }
    .col-head .h-bf { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    .col-head .h-pl { font-size: 11px; font-weight: 600; text-transform: uppercase;
                      letter-spacing: 0.12em; color: var(--ink-dim); }

    /* Butterfly rows */
    .bf-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      padding: 12px 4px;
      border-bottom: 1px solid var(--line);
    }
    .bf-row:hover { background: var(--surface); }
    .bf-name { flex: 1; min-width: 0; cursor: pointer; }
    .bf-common { display: block; font-size: 16px; font-weight: 600; line-height: 1.25; }
    .bf-sci { display: block; font-style: italic; color: var(--ink-dim); font-size: 13px; margin-top: 1px; }

    .plants-cell { display: flex; gap: 8px; flex: 0 0 auto; }

    /* Neutral action buttons (list rows) */
    .toggle-btn {
      background: var(--surface);
      color: var(--ink);
      border: 1px solid transparent;
      padding: 7px 14px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: background 0.12s, border-color 0.12s;
    }
    .toggle-btn:hover { background: var(--surface-hover); border-color: var(--accent); }

    /* Segmented control (plant view) */
    .seg {
      display: inline-flex;
      border: 1px solid rgba(255, 255, 255, 0.30);
      border-radius: 999px;
      overflow: hidden;
    }
    .seg button {
      background: transparent;
      color: var(--ink-dim);
      border: none;
      padding: 7px 18px;
      cursor: pointer;
      font-size: 13px;
      font-family: inherit;
      transition: background 0.12s, color 0.12s;
    }
    .seg button + button { border-left: 1px solid rgba(255, 255, 255, 0.30); }
    .seg button.on { background: var(--accent); color: var(--accent-ink); font-weight: 700; }

    /* Plant view */
    .back {
      background: none; border: none; color: var(--ink-dim); cursor: pointer;
      padding: 14px 0 6px; font-size: 13px; font-family: inherit;
    }
    .back:hover { color: var(--ink); }
    .plant-head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin-bottom: 4px; }
    #main ul { margin: 12px 0 0; padding-left: 20px; }
    #main li { margin-bottom: 6px; line-height: 1.4; }
    .bloom { color: var(--ink-dim); font-size: 0.85em; }
    .source { font-size: 12px; color: var(--ink-dim); margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--line); line-height: 1.5; }
    .source a { color: var(--accent); text-decoration: none; }
    .source a:hover { text-decoration: underline; }

    /* Settings footer */
    #settings { flex: 0 0 auto; background: var(--green-900); border-top: 1px solid var(--line); }
    .settings-head {
      display: flex; align-items: center; justify-content: space-between;
      padding: 14px 18px; cursor: pointer; user-select: none;
      font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.1em;
    }
    .settings-head .chev { transition: transform 0.15s; color: var(--ink-dim); }
    .settings-head.collapsed .chev { transform: rotate(-90deg); }
    .settings-body { padding: 0 18px 16px; }
    .settings-body.hidden { display: none; }
    .settings-body label {
      display: block; margin: 12px 0 6px;
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.08em; color: var(--ink-dim);
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      background: transparent;
      color: var(--ink);
      border: 1px solid rgba(255, 255, 255, 0.30);
      padding: 6px 12px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 12px;
      font-family: inherit;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }
    .chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 600; }

    .radius-row { display: flex; align-items: center; gap: 12px; margin-top: 8px; }
    .radius-row input[type=range] { flex: 1; accent-color: var(--accent); }
    .radius-val { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; }

    /* Time period: dual-handle range slider */
    .range2 { position: relative; flex: 1; height: 24px; }
    .range2 .track, .range2 .fill {
      position: absolute; top: 50%; height: 4px; margin-top: -2px; border-radius: 2px;
    }
    .range2 .track { left: 0; right: 0; background: rgba(255, 255, 255, 0.25); }
    .range2 .fill { background: var(--accent); }
    .range2 input[type=range] {
      position: absolute; left: 0; top: 0; width: 100%; height: 24px; margin: 0;
      background: none; pointer-events: none; -webkit-appearance: none; appearance: none;
    }
    .range2 input[type=range]::-webkit-slider-runnable-track { background: none; height: 24px; }
    .range2 input[type=range]::-moz-range-track { background: none; }
    .range2 input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none; pointer-events: auto; cursor: pointer;
      width: 16px; height: 16px; margin-top: 4px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--green-900);
    }
    .range2 input[type=range]::-moz-range-thumb {
      pointer-events: auto; cursor: pointer;
      width: 12px; height: 12px; border-radius: 50%;
      background: var(--accent); border: 2px solid var(--green-900);
    }
    .time-val { min-width: 118px; text-align: right; font-variant-numeric: tabular-nums; font-size: 14px; white-space: nowrap; }

    /* ---------- Option A: ecoregions ---------- */
    .sec-head { display: flex; justify-content: space-between; align-items: baseline;
                padding: 16px 0 10px; border-bottom: 1px solid var(--line); }
    .sec-head .h-bf { font-size: 20px; font-weight: 700; letter-spacing: -0.01em; }
    .sec-head .h-pl { font-size: 11px; font-weight: 600; text-transform: uppercase;
                      letter-spacing: 0.12em; color: var(--ink-dim); }

    details.zone { border-bottom: 1px solid var(--line); }
    details.zone summary {
      list-style: none; cursor: pointer; display: flex; justify-content: space-between;
      align-items: center; padding: 12px 4px; font-weight: 600;
    }
    details.zone summary::-webkit-details-marker { display: none; }
    details.zone summary::before { content: "▸"; color: var(--ink-dim); margin-right: 8px; transition: transform 0.12s; }
    details.zone[open] summary::before { transform: rotate(90deg); }
    details.zone summary .zname { flex: 1; }
    details.zone summary:hover { background: var(--surface); }
    .count { font-size: 12px; color: var(--ink-dim); font-variant-numeric: tabular-nums; white-space: nowrap; }

    .region-row {
      display: flex; justify-content: space-between; align-items: center; gap: 10px;
      padding: 8px 4px 8px 26px; cursor: pointer; font-size: 14px;
    }
    .region-row:hover { background: var(--surface); }
    .region-row.empty { color: var(--ink-dim); }
    .swatch { width: 10px; height: 10px; border-radius: 2px; flex: 0 0 auto; border: 1px solid rgba(255,255,255,0.35); }

    .region-title { padding: 4px 0 2px; }
    .region-title .rname { display: block; font-size: 20px; font-weight: 700; line-height: 1.2; }
    .region-title .rzone { display: block; font-size: 13px; color: var(--ink-dim); margin-top: 2px; }
    .bf-count { display: block; font-size: 12px; color: var(--ink-dim); margin-top: 2px; }

    /* Map legend + tooltip */
    .legend {
      background: rgba(255, 255, 255, 0.94); color: #22301b; padding: 8px 10px; border-radius: 6px;
      font: 12px "Helvetica Neue", Helvetica, Arial, sans-serif; box-shadow: 0 1px 6px rgba(0,0,0,0.25);
      line-height: 1.5;
    }
    .legend b { display: block; margin-bottom: 4px; font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; }
    .legend i { display: inline-block; width: 14px; height: 10px; margin-right: 6px; border-radius: 2px;
                vertical-align: -1px; border: 1px solid rgba(0,0,0,0.2); }
    .leaflet-tooltip.eco-tip { font: 13px "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .eco-tip .t-sub { color: #666; font-size: 12px; }
  </style>
</head>

<body>

  <div id="layout">
    <div id="sidebar">
      <div id="main">
        <p class="hint">Loading ecoregions…</p>
      </div>
      <div id="settings">
        <div class="settings-head" id="settingsHead">
          <span>Options</span><span class="chev">▾</span>
        </div>
        <div class="settings-body" id="settingsBody">
          <label>Butterfly Occurrence Sources</label>
          <div class="chips" id="occChips"></div>
          <label>Associated Plant Sources</label>
          <div class="chips" id="plantChips"></div>
          <label>Time Period</label>
          <div class="radius-row">
            <div class="range2">
              <div class="track"></div>
              <div class="fill" id="timeFill"></div>
              <input type="range" id="timeStart" min="0" max="0" value="0" />
              <input type="range" id="timeEnd" min="0" max="0" value="0" />
            </div>
            <span class="time-val" id="timeVal">–</span>
          </div>
        </div>
      </div>
    </div>
    <div id="map"></div>
  </div>

  <script>
    // ---------- State ----------
    let observations = [], plantLists = [], plantIndex = {};
    let regions = [];                 // GeoJSON features (properties: id, name, zoneId, zoneName)
    let regionStats = new Map();      // regionId -> Map(scientificName -> {commonName, count})
    let selectedRegion = null;        // region id
    let viewMode = 'regions';         // 'regions' | 'list' | 'plants'
    let currentSpecies = [];
    let activeButterfly = null, activeCategory = 'host';
    let enabledPlantSources = new Set();
    const OCC_SOURCES = [{ id: 'inat-bimby', label: 'iNaturalist (BIMBY)' }];
    let enabledOccSources = new Set(OCC_SOURCES.map(s => s.id));
    const DAY_MS = 86400000;
    let baseDateMs = 0, startDay = 0, endDay = 0;

    // Sequential scale: species seen per ecoregion (one hue, light -> dark)
    const BINS = [
      { min: 61, color: '#7a3d0a', label: '61+' },
      { min: 31, color: '#b8691c', label: '31–60' },
      { min: 16, color: '#e79a3c', label: '16–30' },
      { min: 6,  color: '#f4bf74', label: '6–15' },
      { min: 1,  color: '#fbe3bd', label: '1–5' },
    ];
    const colorFor = n => (BINS.find(b => n >= b.min) || {}).color || null;

    // ---------- Map ----------
    const map = L.map('map').setView([58.0, -96.0], 4);
    L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        + ' | Ecoregions: <a href="https://sis.agr.gc.ca/cansis/nsdb/ecostrat/" target="_blank" rel="noopener">AAFC</a>'
    }).addTo(map);
    let regionLayer = null;
    const layerById = new Map();

    const legend = L.control({ position: 'bottomright' });
    legend.onAdd = () => {
      const d = L.DomUtil.create('div', 'legend');
      d.innerHTML = '<b>Butterfly species seen</b>' +
        BINS.map(b => `<div><i style="background:${b.color}"></i>${b.label}</div>`).join('') +
        '<div><i style="background:transparent"></i>None recorded</div>';
      return d;
    };
    legend.addTo(map);

    // ---------- Load data ----------
    Promise.all([
      fetch('data/observations.json').then(r => r.json()),
      fetch('data/plant-lists.json').then(r => r.json()),
      fetch('data/ecoregions.geojson').then(r => r.json()),
      fetch('data/observation-ecoregions.json').then(r => r.json()),
    ]).then(([obs, lists, geo, obsRegion]) => {
      observations = obs; plantLists = lists; regions = geo.features;
      for (const o of observations) o._region = obsRegion[o.id] ?? null;
      for (const l of lists) (plantIndex[l.butterfly.scientificName] ??= []).push(l);
      enabledPlantSources = new Set(lists.map(l => l.id));
      buildChips();
      initTimeSlider();
      computeStats();
      drawRegions();
      renderMain();
    }).catch(err => {
      document.getElementById('main').innerHTML = '<p class="hint">Could not load data files.</p>';
      console.error(err);
    });

    // ---------- Stats (re-run when the time period changes) ----------
    function computeStats() {
      regionStats = new Map();
      for (const o of observations) {
        if (o._region == null || o._day < startDay || o._day > endDay) continue;
        let m = regionStats.get(o._region);
        if (!m) regionStats.set(o._region, m = new Map());
        const s = m.get(o.scientificName);
        s ? s.count++ : m.set(o.scientificName, { scientificName: o.scientificName, commonName: o.commonName, count: 1 });
      }
    }
    const speciesCount = id => regionStats.get(id)?.size || 0;
    const regionById = id => regions.find(f => f.properties.id === id);

    // ---------- Region layer ----------
    function styleFor(f) {
      const id = f.properties.id, n = speciesCount(id), c = colorFor(n), sel = id === selectedRegion;
      return {
        color: sel ? '#22301b' : '#5b6b52', weight: sel ? 3 : 0.8, opacity: sel ? 1 : 0.6,
        // While a region is selected, fade the others so it stands out
        fillColor: c || '#ffffff',
        fillOpacity: !c ? 0.05 : (selectedRegion == null || sel ? 0.75 : 0.3),
      };
    }

    function drawRegions() {
      regionLayer = L.geoJSON({ type: 'FeatureCollection', features: regions }, {
        style: styleFor,
        onEachFeature: (f, layer) => {
          layerById.set(f.properties.id, layer);
          layer.bindTooltip(() => {
            const n = speciesCount(f.properties.id);
            return `<b>${f.properties.name}</b><br><span class="t-sub">${f.properties.zoneName} · ` +
              `${n ? n + ' species' : 'no sightings'}</span>`;
          }, { sticky: true, className: 'eco-tip' });
          layer.on('mouseover', () => { if (f.properties.id !== selectedRegion) layer.setStyle({ weight: 2, opacity: 1 }); });
          layer.on('mouseout', () => regionLayer.resetStyle(layer));
          layer.on('click', () => selectRegion(f.properties.id, false));
        }
      }).addTo(map);
    }

    function restyleRegions() {
      regionLayer.setStyle(styleFor);
      const sel = layerById.get(selectedRegion);
      if (sel) sel.bringToFront();
    }

    function selectRegion(id, zoom = true) {
      selectedRegion = id; viewMode = 'list'; activeButterfly = null;
      restyleRegions();
      if (zoom) map.fitBounds(layerById.get(id).getBounds(), { padding: [30, 30] });
      renderMain();
    }

    function clearRegion() {
      selectedRegion = null; viewMode = 'regions';
      restyleRegions(); renderMain();
    }

    function enabledListsFor(name) {
      return (plantIndex[name] || []).filter(l => enabledPlantSources.has(l.id));
    }

    // ---------- Render ----------
    function renderMain() {
      if (viewMode === 'plants') renderPlantView();
      else if (viewMode === 'list' && selectedRegion != null) renderListView();
      else renderRegionsView();
    }

    // View 0: ecozones -> ecoregions
    function renderRegionsView() {
      const box = document.getElementById('main');
      const zones = new Map();
      for (const f of regions) {
        const p = f.properties;
        (zones.get(p.zoneName) || zones.set(p.zoneName, []).get(p.zoneName)).push(p);
      }
      const openZones = new Set([...box.querySelectorAll('details.zone[open]')].map(d => d.dataset.zone));
      const zoneList = [...zones.entries()].sort((a, b) => a[0].localeCompare(b[0]));

      box.innerHTML = `<div class="sec-head"><span class="h-bf">Ecoregions</span><span class="h-pl">Species</span></div>
        <p class="hint" style="padding-top:10px">Click a region on the map, or pick one below.</p>` +
        zoneList.map(([zone, rs]) => {
          rs.sort((a, b) => a.name.localeCompare(b.name));
          const withData = rs.filter(r => speciesCount(r.id) > 0).length;
          return `<details class="zone" data-zone="${zone}" ${openZones.has(zone) ? 'open' : ''}>
            <summary><span class="zname">${zone}</span><span class="count">${withData}/${rs.length} regions</span></summary>
            ${rs.map(r => {
              const n = speciesCount(r.id), c = colorFor(n);
              return `<div class="region-row ${n ? '' : 'empty'}" data-id="${r.id}">
                <span style="display:flex;align-items:center;gap:8px;min-width:0">
                  <span class="swatch" style="background:${c || 'transparent'}"></span>${r.name}</span>
                <span class="count">${n || '–'}</span></div>`;
            }).join('')}
          </details>`;
        }).join('');

      box.querySelectorAll('.region-row').forEach(el =>
        el.addEventListener('click', () => selectRegion(Number(el.dataset.id))));
    }

    // View A: butterflies in the selected ecoregion
    function renderListView() {
      const box = document.getElementById('main');
      const p = regionById(selectedRegion).properties;
      const stats = regionStats.get(selectedRegion);
      currentSpecies = stats ? [...stats.values()].sort((a, b) =>
        (a.commonName || a.scientificName).localeCompare(b.commonName || b.scientificName)) : [];

      let html = `<button class="back">&larr; All ecoregions</button>
        <div class="region-title"><span class="rname">${p.name}</span>
          <span class="rzone">${p.zoneName} ecozone · ${currentSpecies.length} species</span></div>`;

      if (!currentSpecies.length) {
        html += '<p class="hint">No butterflies recorded here in this time period. Try widening the time period.</p>';
      } else {
        html += `<div class="col-head"><span class="h-bf">Butterflies</span><span class="h-pl">Plants</span></div>` +
          currentSpecies.map(s => `
            <div class="bf-row" data-name="${s.scientificName}">
              <span class="bf-name">
                <span class="bf-common">${s.commonName || s.scientificName}</span>
                <span class="bf-sci">${s.scientificName}</span>
                <span class="bf-count">${s.count} sighting${s.count === 1 ? '' : 's'}</span>
              </span>
              <span class="plants-cell">
                <button class="toggle-btn" data-cat="host">Host</button>
                <button class="toggle-btn" data-cat="nectar">Nectar</button>
              </span>
            </div>`).join('');
      }
      box.innerHTML = html;
      box.scrollTop = 0;

      box.querySelector('.back').addEventListener('click', clearRegion);
      box.querySelectorAll('.toggle-btn').forEach(btn =>
        btn.addEventListener('click', () => {
          activeButterfly = btn.closest('.bf-row').dataset.name;
          activeCategory = btn.dataset.cat; viewMode = 'plants'; renderMain();
        }));
      box.querySelectorAll('.bf-name').forEach(el =>
        el.addEventListener('click', () => {
          activeButterfly = el.closest('.bf-row').dataset.name;
          viewMode = 'plants'; renderMain();
        }));
    }

    // View B: plant list for one butterfly
    function renderPlantView() {
      const box = document.getElementById('main');
      const sp = currentSpecies.find(s => s.scientificName === activeButterfly) || {};
      const lists = enabledListsFor(activeButterfly);

      let html = `<button class="back">&larr; Back to butterflies</button>
        <div class="plant-head">
          <span class="bf-name">
            <span class="bf-common">${sp.commonName || activeButterfly}</span>
            <span class="bf-sci">${activeButterfly}</span>
          </span>
          <span class="seg">
            <button class="${activeCategory === 'host' ? 'on' : ''}" data-cat="host">Host</button>
            <button class="${activeCategory === 'nectar' ? 'on' : ''}" data-cat="nectar">Nectar</button>
          </span>
        </div>`;

      if (lists.length === 0) {
        html += '<p class="hint">No plant data for this species from the selected sources.</p>';
      } else {
        const seen = new Map();
        for (const l of lists)
          for (const p of l.plants)
            if ((activeCategory === 'host') === !!p.isHost && !seen.has(p.scientificName)) seen.set(p.scientificName, p);
        const plants = [...seen.values()];
        html += plants.length
          ? `<ul>${plants.map(p => `<li>${p.commonName} <span class="bf-sci" style="display:inline">(${p.scientificName})</span>${p.bloom ? ` <span class="bloom">&middot; ${p.bloom}</span>` : ''}</li>`).join('')}</ul>`
          : `<p class="hint">None listed as ${activeCategory} plants here.</p>`;
        const srcs = [...new Map(lists.map(l => [l.source.url, l.source])).values()];
        html += `<div class="source">Sources: ${srcs.map(s => `<a href="${s.url}" target="_blank" rel="noopener">${shortSource(s.org)} (${s.year})</a>`).join('; ')}</div>`;
      }
      box.innerHTML = html;

      box.querySelector('.back').addEventListener('click', () => { viewMode = 'list'; renderMain(); });
      box.querySelectorAll('.seg button').forEach(btn =>
        btn.addEventListener('click', () => { activeCategory = btn.dataset.cat; renderPlantView(); }));
    }

    function shortSource(org) { return /xerces/i.test(org) ? 'Xerces Society' : org; }

    // ---------- Settings: chips ----------
    function buildChips() {
      const occ = document.getElementById('occChips');
      occ.innerHTML = OCC_SOURCES.map(s =>
        `<button class="chip ${enabledOccSources.has(s.id) ? 'on' : ''}" data-id="${s.id}">${s.label}</button>`).join('');
      occ.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        toggle(enabledOccSources, c.dataset.id); c.classList.toggle('on');
      }));

      const byOrg = {};
      for (const l of plantLists) (byOrg[l.source.org] ??= []).push(l.id);
      const plant = document.getElementById('plantChips');
      plant.innerHTML = Object.entries(byOrg).map(([org, ids]) => {
        const on = ids.some(id => enabledPlantSources.has(id));
        return `<button class="chip ${on ? 'on' : ''}" data-ids="${ids.join(',')}">${shortSource(org)}</button>`;
      }).join('');
      plant.querySelectorAll('.chip').forEach(c => c.addEventListener('click', () => {
        const ids = c.dataset.ids.split(',');
        const turnOn = !ids.some(id => enabledPlantSources.has(id));
        ids.forEach(id => turnOn ? enabledPlantSources.add(id) : enabledPlantSources.delete(id));
        c.classList.toggle('on', turnOn);
        renderMain();
      }));
    }
    function toggle(set, id) { set.has(id) ? set.delete(id) : set.add(id); }

    // ---------- Settings: collapse ----------
    document.getElementById('settingsHead').addEventListener('click', () => {
      document.getElementById('settingsHead').classList.toggle('collapsed');
      document.getElementById('settingsBody').classList.toggle('hidden');
    });

    // ---------- Settings: time period ----------
    const timeStart = document.getElementById('timeStart');
    const timeEnd = document.getElementById('timeEnd');

    function initTimeSlider() {
      const times = observations.map(o => Date.parse(o.observedOn)).filter(t => !isNaN(t));
      baseDateMs = Math.min(...times);
      const maxDay = Math.round((Math.max(...times) - baseDateMs) / DAY_MS);
      for (const o of observations) {
        const t = Date.parse(o.observedOn);
        o._day = isNaN(t) ? -1 : Math.round((t - baseDateMs) / DAY_MS);
      }
      for (const el of [timeStart, timeEnd]) el.max = maxDay;
      timeStart.value = startDay = 0;
      timeEnd.value = endDay = maxDay;
      updateTimeUI();
    }

    function dayLabel(day, withYear) {
      return new Date(baseDateMs + day * DAY_MS).toLocaleDateString('en-CA',
        { month: 'short', day: 'numeric', timeZone: 'UTC', ...(withYear ? { year: 'numeric' } : {}) });
    }

    function updateTimeUI() {
      const max = Number(timeEnd.max) || 1;
      const multiYear = new Date(baseDateMs).getUTCFullYear() !== new Date(baseDateMs + max * DAY_MS).getUTCFullYear();
      document.getElementById('timeVal').textContent =
        startDay === endDay ? dayLabel(startDay, multiYear) : `${dayLabel(startDay, multiYear)} – ${dayLabel(endDay, multiYear)}`;
      const fill = document.getElementById('timeFill');
      fill.style.left = `calc(8px + (100% - 16px) * ${startDay / max})`;
      fill.style.width = `calc((100% - 16px) * ${(endDay - startDay) / max})`;
      timeStart.style.zIndex = startDay > max - 1 ? 3 : 1;
      timeEnd.style.zIndex = 2;
    }

    function onTimeChange() {
      computeStats(); restyleRegions();
      if (viewMode === 'plants') viewMode = 'list';
      renderMain();
    }

    timeStart.addEventListener('input', () => {
      startDay = Math.min(Number(timeStart.value), endDay);
      timeStart.value = startDay; updateTimeUI();
    });
    timeEnd.addEventListener('input', () => {
      endDay = Math.max(Number(timeEnd.value), startDay);
      timeEnd.value = endDay; updateTimeUI();
    });
    timeStart.addEventListener('change', onTimeChange);
    timeEnd.addEventListener('change', onTimeChange);
  </script>

  <script src="dev-switcher.js"></script>
</body>

</html>
